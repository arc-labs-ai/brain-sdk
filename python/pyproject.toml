[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "brain-db-sdk"
version = "0.1.0"
description = "Python client SDK for the Brain memory database. Speaks Brain's BRN0 wire protocol directly over TCP."
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Niraj Georgian" }]
keywords = ["brain", "memory", "ai-agents", "client", "database"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Database",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    # CBOR (RFC 8949) payload maps. cbor2 distinguishes byte strings from
    # arrays (required for id / [u8;N] fields) and exposes per-value
    # minimal-float encoding, which the wire format needs for f32 fields.
    "cbor2>=5.6",
    # CRC32C is implemented in pure Python (wire/crc32c.py) — no native or
    # network dependency for a core checksum.
]

[project.urls]
Homepage = "https://github.com/brain-db-io/brain-sdk"
Repository = "https://github.com/brain-db-io/brain-sdk"

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
# importlib import mode lets the feature folders (tests/encode/, tests/recall/,
# …) each carry a `test_<feature>.py` without basename collisions against the
# flat offline suites (e.g. tests/test_handshake.py vs tests/handshake/…).
testpaths = ["tests"]
addopts = "--import-mode=importlib"

[tool.hatch.build.targets.wheel]
packages = ["src/brain_db_sdk"]
