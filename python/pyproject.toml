[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "brain-db-sdk"
version = "0.1.0"
description = "Python client SDK for the Brain memory database. Speaks Brain's BRN0 wire protocol directly over TCP."
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Niraj Georgian" }]
keywords = ["brain", "memory", "ai-agents", "client", "database"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Database",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    # CBOR (RFC 8949) payload maps. cbor2 distinguishes byte strings from
    # arrays (required for id / [u8;N] fields) and exposes per-value
    # minimal-float encoding, which the wire format needs for f32 fields.
    # >=5.9 is a security floor, not a feature floor: cbor2 5.6-5.8 are
    # vulnerable to CVE-2026-26209 (CVSS 7.5) -- uncontrolled recursion in
    # loads() lets a peer crash the client with a <100KB deeply-nested payload.
    # 5.9 added the nesting-depth cap that turns that into a clean
    # CBORDecodeError. See tests/test_malformed.py, which pins the behaviour.
    "cbor2>=5.9",
    # CRC32C is implemented in pure Python (wire/crc32c.py) — no native or
    # network dependency for a core checksum.
]

[project.urls]
Homepage = "https://github.com/arc-labs-ai/brain-sdk"
Repository = "https://github.com/arc-labs-ai/brain-sdk"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.16"]

[tool.ruff]
target-version = "py39"

[tool.ruff.lint]
# Deliberately narrow: rules that catch bugs, not rules that reformat.
#   F   pyflakes      -- undefined names, unused imports, bad f-strings
#   E9  syntax errors
#   B   bugbear       -- likely-wrong constructs (blind excepts, lost chaining)
# The full default set flags 476 style issues here; gating on those would bury
# a real finding in import ordering. This selection found four, including two
# public re-exports missing from __all__.
select = ["F", "E9", "B"]

[tool.pytest.ini_options]
# importlib import mode lets the feature folders (tests/encode/, tests/recall/,
# …) each carry a `test_<feature>.py` without basename collisions against the
# flat offline suites (e.g. tests/test_handshake.py vs tests/handshake/…).
testpaths = ["tests"]
addopts = "--import-mode=importlib"

[tool.hatch.build.targets.wheel]
packages = ["src/brain_db_sdk"]
