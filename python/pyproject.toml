[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "brain-db-sdk"
version = "0.1.0"
description = "Python client SDK for the Brain memory database. Speaks Brain's BRN0 wire protocol directly over TCP."
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Niraj Georgian" }]
keywords = ["brain", "memory", "ai-agents", "client", "database"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Database",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    # CBOR (RFC 8949) payload maps. cbor2 distinguishes byte strings from
    # arrays (required for id / [u8;N] fields) and exposes per-value
    # minimal-float encoding, which the wire format needs for f32 fields.
    # >=5.9 is a security floor, not a feature floor: cbor2 5.6-5.8 are
    # vulnerable to CVE-2026-26209 (CVSS 7.5) -- uncontrolled recursion in
    # loads() lets a peer crash the client with a <100KB deeply-nested payload.
    # 5.9 added the nesting-depth cap that turns that into a clean
    # CBORDecodeError. See tests/test_malformed.py, which pins the behaviour.
    "cbor2>=5.9",
    # CRC32C is implemented in pure Python (wire/crc32c.py) — no native or
    # network dependency for a core checksum.
]

[project.urls]
Homepage = "https://github.com/arc-labs-ai/brain-sdk"
Repository = "https://github.com/arc-labs-ai/brain-sdk"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.16", "pyright>=1.1.400"]

[tool.ruff]
target-version = "py39"
# Matches the TypeScript SDK's Biome setting and the width this code was
# already written to. Ruff's default 88 would reflow 198 existing lines for no
# reason; 100 reflows 93 and they are genuinely long.
line-length = 100

[tool.ruff.format]
# The formatter half, which this package did not have. Rust has rustfmt and
# TypeScript now has Biome; leaving Python unformatted was the odd one out.
docstring-code-format = true

[tool.ruff.lint]
# Everything on, exceptions written down.
#
# The previous selection was ["F", "E9", "B"]. Running `--select ALL` produced
# ~3400 findings; the ones removed below are removed for a stated reason, with
# the count they produced, so the next person can see they were considered
# rather than never enabled. Starting from ALL also means a new ruff release
# arrives with its new rules already on, which is the same "no silent drift"
# property the protocol gates give the wire.
select = ["ALL"]

ignore = [
  # -- the formatter owns these ------------------------------------------
  "E501",    # 299. line-too-long: `ruff format` decides line breaks.
  "COM812",  # 174. missing-trailing-comma: same.
  "ISC001",  #      single-line-implicit-concat: conflicts with the formatter.
  "ISC003",  #      explicit-string-concat: directly contradicts ISC004, which
             #      is kept. In a collection literal an *implicit* concat is
             #      one missing comma away from silently merging two elements,
             #      so the explicit `+` is the safer of the two.

  # -- docstring style, not docstring absence -----------------------------
  # This package is heavily documented; what pydocstyle objects to is the
  # *shape*. The prose here is deliberately multi-paragraph and explanatory,
  # and these rules would flatten it.
  "D203",    #      incompatible with D211, which is the convention used.
  "D205",    # 211. blank line required after a one-line summary.
  "D209",    # 164. multi-line closing quotes on their own line.
  "D213",    # 285. multi-line summary on the second line: this codebase puts
             #      the summary on the first line (D212), which is the opposite.
  "D401",    #  21. imperative mood ("Returns the…" vs "Return the…").
  "D400",    #   1. first line must end with a period.
  "D415",    #   1. same, with more punctuation allowed.

  # -- fights what this package is ----------------------------------------
  "PLR2004", #  74. magic-value-comparison: opcodes, CBOR major types and
             #      frame offsets are magic numbers by definition.
  "FBT001",  #  26. boolean-typed positional argument, and
  "FBT002",  #   6. boolean default, and
  "FBT003",  #  91. boolean positional in a call — the wire dataclasses mirror
             #      the server's field order, which is not ours to reshape.
  "TRY003",  #  29. long message outside the exception class, and
  "EM101",   #   7. string literal in a raise, and
  "EM102",   #  22. f-string in a raise — a wire error should say what byte or
             #      field was wrong, at the point that knows.
  "CPY001",  #  49. missing copyright notice: the licence is in LICENSE.
  "UP045",   # 193. `Optional[X]` -> `X | None`, and
  "UP007",   #   2. the same for Union — requires-python is >=3.9, where the
             #      new syntax is not available at runtime and several of these
             #      modules have annotations that are evaluated eagerly.
  "PYI019",  #   3. same TypeVar-instead-of-Self constraint as PYI034 below.
  "PYI034",  #   3. `__enter__` should return `Self` — which is 3.11+, while
             #      requires-python is >=3.9, and `typing_extensions` is not a
             #      dependency. A `TypeVar` bound to the class carries the same
             #      meaning and is what these use; ruff's autofix for this rule
             #      imports typing_extensions and breaks the install.
  "TC001",   #   1. and
  "TC003",   #   3. move typing-only imports into a TYPE_CHECKING block. The
             #      saving is a few microseconds of import time; the risk is a
             #      dataclass or a `get_type_hints` call resolving a name that
             #      is no longer there at runtime. Not worth it for this shape
             #      of code.
  "D107",    #  12. undocumented `__init__`: every one is a one-line
             #      constructor under a class docstring that already says what
             #      the type is and what it carries. A second docstring below
             #      it would restate the first.
  "RUF022",  #   1. `__all__` is grouped by tier (wire, http, client) with a
             #      comment on each group; alphabetising it would scatter the
             #      groups and orphan the comments.
  "D105",    #   8. undocumented magic method: `__enter__`/`__exit__`/`__iter__`
             #      mean exactly what the protocol says they mean.
  "N818",    #  11. exception names must end in "Error": these mirror the Rust
             #      SDK's variant names (VersionMismatch, ConnectionClosed) so
             #      the three SDKs read the same.

  # -- thresholds, not defects --------------------------------------------
  "PLR0913", #   7. too-many-arguments
  "PLR0917", #   7. too-many-positional-arguments
  "PLR0915", #   3. too-many-statements
  "PLR0912", #   2. too-many-branches
  "PLR0911", #   2. too-many-return-statements
  "C901",    #   3. complex-structure

  # -- wrong for this code, on inspection ---------------------------------
  "PERF203", #   4. try-except in a loop: every one is a retry or a
             #      best-effort cleanup, which is what the construct is for.
  "S110",    #   4. try-except-pass: all four are best-effort connection
             #      teardown, already carrying a comment saying so. A failure
             #      to close a socket we are discarding is not actionable.
]

[tool.ruff.lint.per-file-ignores]
# The wire and HTTP type modules mirror the server's structs one-for-one. Their
# documentation is the protocol itself — `conformance/protocol.json` carries
# every field and serde attribute, and the corpus pins the bytes. A docstring
# on each of ~495 generated-equivalent `to_map`/`from_map` methods would
# restate the method name and bury the ones that do carry meaning.
"src/brain_db_sdk/wire/types.py" = ["D101", "D102", "D105", "D106", "D107", "RUF012"]
"src/brain_db_sdk/http/types.py" = ["D101", "D102", "D105", "D106", "D107"]

# Tests: `assert` is what pytest is built on, fixture data is camelCase because
# the wire is, and the feature folders deliberately have no `__init__.py` (the
# pytest importlib mode below is what makes that work).
"tests/**" = [
  "S101",    # 368. assert
  "INP001",  #  30. implicit namespace package
  "ANN",     # 111. missing annotations on test helpers
  "D100", "D101", "D102", "D103", "D104", "D107",
  "N815",    #   4. camelCase in class scope — JSON fixture keys
  "N812",    #   1. lowercase import aliased to non-lowercase
  "PLC0415", #   3. import outside top-level — deliberate lazy imports
  "E402",    #   1. import not at top — after a guard
  "PT018",   #  15. composite assertion
  "SLF001",  #      private member access: tests check internals on purpose
  "S105", "S106", "S311",
]

[tool.pytest.ini_options]
# importlib import mode lets the feature folders (tests/encode/, tests/recall/,
# …) each carry a `test_<feature>.py` without basename collisions against the
# flat offline suites (e.g. tests/test_handshake.py vs tests/handshake/…).
testpaths = ["tests"]
addopts = "--import-mode=importlib"
markers = ["slow: builds a wheel; excluded from the default run with -m 'not slow'"]

[tool.hatch.build.targets.wheel]
packages = ["src/brain_db_sdk"]
# PEP 561: without this marker in the built wheel, a downstream type checker
# MUST ignore every annotation in the installed package — so all of the typing
# above would reach exactly nobody. `tests/test_py_typed.py` asserts it is
# present and listed here.
artifacts = ["src/brain_db_sdk/py.typed"]

[tool.pyright]
# The type checker the other two SDKs always had: Rust has the compiler,
# TypeScript has `tsc`, and Python had annotations that nothing verified.
#
# pyright rather than mypy because this package advertises
# `requires-python = ">=3.9"` and mypy 2.x refuses to target anything below
# 3.10 — a checker that cannot check the floor we ship is not checking the
# thing that matters. pyright is also what Pylance runs, so what CI enforces is
# what a user sees in their editor.
include = ["src/brain_db_sdk"]
pythonVersion = "3.9"
# `standard`, not `strict`, and the difference is recorded rather than hidden:
# strict additionally reports 112 `reportUnknown*` diagnostics, essentially all
# of them in `wire/types.py`'s externally-tagged union helpers, where a
# `variant: str` selects which of several shapes `value` holds. Typing those
# fully means writing out every union arm; four of the eleven are done (see
# AuthCredentials, StatementValue, StatementObject, RetrieverSelection) and the
# rest are the same mechanical work. `standard` gates on every diagnostic that
# indicates an actual type error, which is what this is for; the count above is
# the honest size of what it does not yet cover.
typeCheckingMode = "standard"
# Reported as errors rather than warnings so CI actually gates on them.
reportMissingTypeStubs = "error"
