name: CI

# Mirrors brain-db's flow: feature -> dev -> main, with the dev -> main PR as
# the release gate. `pull_request` covers both hops; `push` is main-only and
# deliberately excludes dev. In brain-db, having dev as a push trigger while it
# was also the head of the standing dev -> main PR made every merge into dev
# raise two runs of this workflow on one commit — 71 minutes of wall-clock
# burned across three such collisions before it was caught.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main, dev]

# Cancel a superseded PR run; never cancel a push to main, where a half-run
# release check is worse than a slightly stale one.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  protocol:
    name: Protocol types
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # Compares all three SDKs' declared wire types against the vendored
      # server manifest. Runs first and gates nothing else explicitly, but a
      # failure here explains most failures below.
      - name: Check protocol types
        run: ./tools/check_protocol.sh

      # The HTTP boundary's equivalent: brain-edge serves 25 method+path
      # combos and the clients covered 9, so a whole tier of the product was
      # unreachable over JSON. This fails when an SDK misses a route the edge
      # serves, or serves one it does not.
      - name: Check HTTP contract
        run: python3 tools/check_http_contract.py
      - name: Check API surface parity
        run: python3 tools/compare_api.py

  rust:
    name: Rust SDK
    runs-on: ubuntu-26.04
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Test (incl. conformance corpus)
        run: cargo test --all-targets
      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - name: Audit dependencies
        run: cargo audit

  python:
    name: Python SDK (${{ matrix.python-version }})
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        # pyproject claims requires-python = ">=3.10"; testing only 3.12 meant
        # that claim was never checked. The ends are what matter -- the floor we
        # advertise and the newest release -- plus one in between.
        #
        # The floor was 3.9 until 2026-10-07, when the ubuntu-26.04 runner image
        # stopped shipping it (3.9 reached EOL in October 2025) and this job
        # began dying at setup-python before running a single test. Advertising
        # a floor that CI cannot install is an unverifiable claim, so the floor
        # moved up to what we can actually prove.
        python-version: ["3.10", "3.11", "3.13"]
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install (editable + dev)
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: python -m ruff check src tests
      - name: Format check
        run: python -m ruff format --check src tests
      - name: Type check
        run: python -m pyright
      - name: Test (incl. conformance corpus)
        run: python -m pytest -q

  typescript:
    name: TypeScript SDK
    runs-on: ubuntu-26.04
    defaults:
      run:
        working-directory: typescript
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: typescript/package-lock.json
      - name: Install
        run: npm ci
      - name: Build
        run: npm run build
      - name: Typecheck
        run: npm run typecheck
      - name: Lint + format check
        run: npm run lint
      - name: Test (incl. conformance corpus)
        run: npm test
