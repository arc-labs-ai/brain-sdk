name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  protocol:
    name: Protocol types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Compares all three SDKs' declared wire types against the vendored
      # server manifest. Runs first and gates nothing else explicitly, but a
      # failure here explains most failures below.
      - name: Check protocol types
        run: ./tools/check_protocol.sh

      # The HTTP boundary's equivalent: brain-edge serves 25 method+path
      # combos and the clients covered 9, so a whole tier of the product was
      # unreachable over JSON. This fails when an SDK misses a route the edge
      # serves, or serves one it does not.
      - name: Check HTTP contract
        run: python3 tools/check_http_contract.py

  rust:
    name: Rust SDK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Test (incl. conformance corpus)
        run: cargo test --all-targets

  python:
    name: Python SDK (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # pyproject claims requires-python = ">=3.9"; testing only 3.12 meant
        # that claim was never checked. The ends are what matter -- the floor we
        # advertise and the newest release -- plus one in between.
        python-version: ["3.9", "3.11", "3.13"]
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install (editable + dev)
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: python -m ruff check src tests
      - name: Test (incl. conformance corpus)
        run: python -m pytest -q

  typescript:
    name: TypeScript SDK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: typescript
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: typescript/package-lock.json
      - name: Install
        run: npm ci
      - name: Build
        run: npm run build
      - name: Typecheck
        run: npm run typecheck
      - name: Test (incl. conformance corpus)
        run: npm test
