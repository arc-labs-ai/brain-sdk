name: Release

# Publishes all three SDK packages to their public registries when a version
# tag is pushed.
#
# The tag normally comes from `release-please.yml`, not from a shell: merging
# the Release PR it maintains bumps the version in all three manifests, writes
# the CHANGELOG, and creates the tag. Tagging by hand still works and is the
# escape hatch:
#
#   git tag v0.1.0 && git push origin v0.1.0
#
# The version check below is what makes both paths safe — a tag that disagrees
# with a package's manifest cannot publish it.
#
# Auth is OIDC **Trusted Publishing** everywhere — no long-lived registry
# tokens live in this repo. Each job exchanges the workflow's short-lived
# GitHub OIDC identity for a scoped, single-use publish credential, and every
# artifact carries build provenance/attestation. This is why each job requests
# `id-token: write`.
#
# ONE-TIME registry setup (done on each registry, not here) — register this
# repo + this workflow file as a Trusted Publisher:
#   • crates.io  → crate settings → Trusted Publishing → GitHub:
#       owner arc-labs-ai, repo brain-sdk, workflow release.yml, env release
#   • PyPI       → project → Publishing → Add a GitHub publisher:
#       owner arc-labs-ai, repo brain-sdk, workflow release.yml, env release
#   • npmjs.com  → package → Settings → Trusted Publisher → GitHub Actions:
#       owner arc-labs-ai, repo brain-sdk, workflow release.yml
# Until a registry's trusted publisher is configured, that job's publish step
# fails closed (it never falls back to a token).
#
# Each job first verifies the tag matches its package's declared version (a
# mistyped tag can't publish the wrong version) and runs the test suite before
# publishing. Jobs are independent — one registry failing doesn't block the
# others. Registries reject re-publishing the same version, so re-running after
# a partial success is a no-op for the already-published packages.
#
# The `release` environment gates every publish; require reviewers on it
# (Settings → Environments → release) to add a manual approval before anything
# goes public.

on:
  push:
    tags:
      - "v*"

# No repo-wide write; each job opts into `id-token: write` for OIDC.
permissions:
  contents: read

jobs:
  rust:
    name: Publish Rust → crates.io
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write # OIDC → crates.io trusted publishing
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify tag matches crate version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          CRATE="$(grep -m1 '^version' Cargo.toml | sed 's/.*"\(.*\)".*/\1/')"
          echo "tag=$TAG crate=$CRATE"
          test "$TAG" = "$CRATE" || { echo "::error::tag $TAG != crate version $CRATE"; exit 1; }
      - name: Test
        run: cargo test --all-targets
      # Exchanges the GitHub OIDC token for a short-lived crates.io token.
      - name: Authenticate to crates.io (OIDC)
        id: auth
        uses: rust-lang/crates-io-auth-action@v1
      - name: Publish
        run: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

  python:
    name: Publish Python → PyPI
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write # OIDC → PyPI trusted publishing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify tag matches project version
        working-directory: python
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VER="$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")"
          echo "tag=$TAG project=$VER"
          test "$TAG" = "$VER" || { echo "::error::tag $TAG != project version $VER"; exit 1; }
      - name: Install + test
        working-directory: python
        run: |
          python -m pip install --upgrade pip build
          python -m pip install -e ".[dev]"
          python -m pytest -q
      - name: Build sdist + wheel
        working-directory: python
        run: python -m build
      # No username/password — the action mints a scoped token via OIDC.
      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: python/dist

  typescript:
    name: Publish TypeScript → npm
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write # OIDC → npm trusted publishing + provenance
    defaults:
      run:
        working-directory: typescript
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
          cache: npm
          cache-dependency-path: typescript/package-lock.json
      # npm Trusted Publishing (OIDC) requires npm >= 11.5.1; Node 22 ships an
      # older bundled npm, so upgrade before publishing.
      - name: Upgrade npm (trusted-publishing support)
        run: npm install -g npm@latest
      - name: Verify tag matches package version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VER="$(node -p "require('./package.json').version")"
          echo "tag=$TAG package=$VER"
          test "$TAG" = "$VER" || { echo "::error::tag $TAG != package version $VER"; exit 1; }
      - run: npm ci
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      # OIDC trusted publishing: no NODE_AUTH_TOKEN. npm detects the trusted
      # publisher and attaches provenance automatically.
      - name: Publish
        run: npm publish
