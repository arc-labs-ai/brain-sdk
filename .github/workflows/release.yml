name: Release

# Publishes all three SDK packages to their public registries when a version
# tag is pushed.
#
# The tag normally comes from `release-please.yml`, not from a shell: merging
# the Release PR it maintains bumps the version in all three manifests, writes
# the CHANGELOG, and creates the tag. Tagging by hand still works and is the
# escape hatch:
#
#   git tag v0.1.0 && git push origin v0.1.0
#
# The version check below is what makes both paths safe — a tag that disagrees
# with a package's manifest cannot publish it.
#
# Auth is OIDC **Trusted Publishing** everywhere — no long-lived registry
# tokens live in this repo. Each job exchanges the workflow's short-lived
# GitHub OIDC identity for a scoped, single-use publish credential, and every
# artifact carries build provenance/attestation. This is why each job requests
# `id-token: write`.
#
# ONE-TIME registry setup (done on each registry, not here) — register this
# repo + this workflow file as a Trusted Publisher:
#   • crates.io  → crate settings → Trusted Publishing → GitHub:
#       owner arc-labs-ai, repo brain-sdk, workflow release.yml, env release
#   • PyPI       → project → Publishing → Add a GitHub publisher:
#       owner arc-labs-ai, repo brain-sdk, workflow release.yml, env release
#   • npmjs.com  → package → Settings → Trusted Publisher → GitHub Actions:
#       owner arc-labs-ai, repo brain-sdk, workflow release.yml
# Until a registry's trusted publisher is configured, that job's publish step
# fails closed (it never falls back to a token).
#
# Each job first verifies the tag matches its package's declared version (a
# mistyped tag can't publish the wrong version) and runs the test suite before
# publishing. Jobs are independent — one registry failing doesn't block the
# others. Registries reject re-publishing the same version, so re-running after
# a partial success is a no-op for the already-published packages.
#
# The `release` environment gates every publish; require reviewers on it
# (Settings → Environments → release) to add a manual approval before anything
# goes public.

on:
  push:
    tags:
      - "v*"
  # Escape hatch. The tag these jobs key off is created by release-please; if
  # that tag's run is lost, fails partway, or never fires at all, there is
  # otherwise no way to publish without deleting and re-pushing a published
  # tag. This republishes any existing version tag by hand.
  #
  # Re-running after a PARTIAL success is safe but NOT quiet, and the
  # difference matters when you are reading the result:
  #
  #   crates.io  rejects the duplicate, job FAILS  ("already exists on the index")
  #   npm        rejects the duplicate, job FAILS  ("cannot publish over ...")
  #   PyPI       skips the duplicate,   job PASSES (skip-existing)
  #
  # So a red job on a re-run usually means "this one already shipped", which
  # looks exactly like "this one failed to ship". Read the log line, not the
  # colour — and confirm against the registry itself. v0.2.0 shipped to npm and
  # PyPI but not crates.io, and the npm job on the repair run went red for the
  # harmless reason while crates.io went green for the real one.
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing version tag to publish (e.g. v0.1.0)"
        required: true
        type: string

# No repo-wide write; each job opts into `id-token: write` for OIDC.
permissions:
  contents: read

# Resolved once, read by every job. On a tag push github.ref_name is already
# `vX.Y.Z`; on a manual dispatch it would be the branch the hatch was fired
# from, which would make each job's tag-vs-manifest check compare a branch
# name against a version and fail.
env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  rust:
    name: Publish Rust → crates.io
    runs-on: ubuntu-26.04
    environment: release
    permissions:
      contents: read
      id-token: write # OIDC → crates.io trusted publishing
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify tag matches crate version
        run: |
          TAG="${RELEASE_TAG#v}"
          CRATE="$(grep -m1 '^version' Cargo.toml | sed 's/.*"\(.*\)".*/\1/')"
          echo "tag=$TAG crate=$CRATE"
          test "$TAG" = "$CRATE" || { echo "::error::tag $TAG != crate version $CRATE"; exit 1; }
      - name: Test
        run: cargo test --all-targets
      # release-please bumps `rust/Cargo.toml` through `extra-files`, but it has
      # no updater that can bump `rust/Cargo.lock`, so at tag time the lock
      # still records the PREVIOUS version of this crate. The `Test` step above
      # is what notices: cargo re-resolves and rewrites the lock, which leaves
      # the working tree dirty, and `cargo publish` then refuses to package a
      # dirty tree. v0.2.0 reached npm and PyPI and never reached crates.io for
      # exactly this reason.
      #
      # Commit that one file inside the runner's throwaway checkout so the lock
      # agrees with the manifest and the tree is clean. Nothing is ever pushed.
      #
      # Scoping the commit to Cargo.lock is deliberate: `--allow-dirty` would
      # also wave through a stray uncommitted source file, whereas this leaves
      # publish's dirty-tree check doing its real job on everything else.
      - name: Reconcile the lockfile the manifest bump left behind
        run: |
          if git diff --quiet -- Cargo.lock; then
            echo "lockfile already matches the manifest; nothing to reconcile"
          else
            git -c user.name='github-actions[bot]' \
                -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
                commit --quiet -m 'chore: sync Cargo.lock to the tagged version' \
                -- Cargo.lock
            echo "committed the regenerated lockfile locally (never pushed)"
          fi
      # Exchanges the GitHub OIDC token for a short-lived crates.io token.
      - name: Authenticate to crates.io (OIDC)
        id: auth
        uses: rust-lang/crates-io-auth-action@v1
      - name: Publish
        run: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

  python:
    name: Publish Python → PyPI
    runs-on: ubuntu-26.04
    environment: release
    permissions:
      contents: read
      id-token: write # OIDC → PyPI trusted publishing
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Verify tag matches project version
        working-directory: python
        run: |
          TAG="${RELEASE_TAG#v}"
          VER="$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")"
          echo "tag=$TAG project=$VER"
          test "$TAG" = "$VER" || { echo "::error::tag $TAG != project version $VER"; exit 1; }
      - name: Install + test
        working-directory: python
        run: |
          python -m pip install --upgrade pip build
          python -m pip install -e ".[dev]"
          python -m pytest -q
      - name: Build sdist + wheel
        working-directory: python
        run: python -m build
      # No username/password — the action mints a scoped token via OIDC.
      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: python/dist

  typescript:
    name: Publish TypeScript → npm
    runs-on: ubuntu-26.04
    environment: release
    permissions:
      contents: read
      id-token: write # OIDC → npm trusted publishing + provenance
    defaults:
      run:
        working-directory: typescript
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
          cache: npm
          cache-dependency-path: typescript/package-lock.json
      # npm Trusted Publishing (OIDC) requires npm >= 11.5.1; Node 22 ships an
      # older bundled npm, so upgrade before publishing.
      - name: Upgrade npm (trusted-publishing support)
        run: npm install -g npm@latest
      - name: Verify tag matches package version
        run: |
          TAG="${RELEASE_TAG#v}"
          VER="$(node -p "require('./package.json').version")"
          echo "tag=$TAG package=$VER"
          test "$TAG" = "$VER" || { echo "::error::tag $TAG != package version $VER"; exit 1; }
      - run: npm ci
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      # OIDC trusted publishing: no NODE_AUTH_TOKEN. npm detects the trusted
      # publisher and attaches provenance automatically.
      - name: Publish
        run: npm publish
