name: Release

# Publishes all three SDK packages to their public registries when a
# version tag is pushed:
#
#   git tag v0.1.0 && git push origin v0.1.0
#
# Each job verifies the tag matches its package's declared version (so a
# mistyped tag can't publish the wrong version), runs the test suite, then
# publishes. Jobs are independent — one registry failing doesn't block the
# others. Registries don't allow re-publishing the same version, so a re-run
# after a partial success is a no-op for the already-published packages.
#
# Required repo secrets (Settings → Secrets and variables → Actions):
#   CARGO_REGISTRY_TOKEN   crates.io API token (scope: publish-update)
#   PYPI_API_TOKEN         PyPI API token (or switch to Trusted Publishing)
#   NPM_TOKEN              npm automation token
#
# The `release` environment lets you require a manual approval before any
# publish runs (Settings → Environments → release → required reviewers).

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  rust:
    name: Publish Rust → crates.io
    runs-on: ubuntu-latest
    environment: release
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify tag matches crate version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          CRATE="$(grep -m1 '^version' Cargo.toml | sed 's/.*"\(.*\)".*/\1/')"
          echo "tag=$TAG crate=$CRATE"
          test "$TAG" = "$CRATE" || { echo "::error::tag $TAG != crate version $CRATE"; exit 1; }
      - name: Test
        run: cargo test --all-targets
      - name: Publish
        run: cargo publish --token "${{ secrets.CARGO_REGISTRY_TOKEN }}"

  python:
    name: Publish Python → PyPI
    runs-on: ubuntu-latest
    environment: release
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify tag matches project version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VER="$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")"
          echo "tag=$TAG project=$VER"
          test "$TAG" = "$VER" || { echo "::error::tag $TAG != project version $VER"; exit 1; }
      - name: Install + test
        run: |
          python -m pip install --upgrade pip build twine
          python -m pip install -e ".[dev]"
          python -m pytest -q
      - name: Build sdist + wheel
        run: python -m build
      - name: Publish
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: python -m twine upload --non-interactive dist/*

  typescript:
    name: Publish TypeScript → npm
    runs-on: ubuntu-latest
    environment: release
    defaults:
      run:
        working-directory: typescript
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
          cache: npm
          cache-dependency-path: typescript/package-lock.json
      - name: Verify tag matches package version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VER="$(node -p "require('./package.json').version")"
          echo "tag=$TAG package=$VER"
          test "$TAG" = "$VER" || { echo "::error::tag $TAG != package version $VER"; exit 1; }
      - run: npm ci
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - name: Publish
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
